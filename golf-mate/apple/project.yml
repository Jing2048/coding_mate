name: GolfAiJing
options:
  bundleIdPrefix: com.jing.golfai
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "15.4"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    # App Store Connect product / archive name (must be unique; GolfMate is taken)
    PRODUCT_NAME: Golf-ai-Jing

targets:
  GolfAiJing:
    type: application
    platform: iOS
    sources:
      - path: GolfMate
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jing.golfai.GolfAiJing
        PRODUCT_NAME: Golf-ai-Jing
    info:
      path: Config/GolfMate-Info.plist
      properties:
        CFBundleDisplayName: Golf-ai-Jing
        CFBundleName: Golf-ai-Jing
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: Config/GolfMate.entitlements
    dependencies:
      - target: GolfAiJingWatch
        embed: true

  GolfAiJingWatch:
    type: application
    platform: watchOS
    sources:
      - path: GolfMateWatch
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jing.golfai.GolfAiJing.watchkitapp
        PRODUCT_NAME: Golf-ai-Jing
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
    info:
      path: Config/GolfMateWatch-Info.plist
      properties:
        CFBundleDisplayName: Golf-ai-Jing
        CFBundleName: Golf-ai-Jing
        NSMotionUsageDescription: Golf-ai-Jing uses full-rate wrist motion to analyze your golf swing.
        NSHealthShareUsageDescription: Golf-ai-Jing starts a golf workout to enable high-rate motion capture.
        NSHealthUpdateUsageDescription: Golf-ai-Jing records the active golf workout used for swing capture.
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.jing.golfai.GolfAiJing
    entitlements:
      path: Config/GolfMateWatch.entitlements

schemes:
  Golf-ai-Jing:
    build:
      targets:
        GolfAiJing: all
        GolfAiJingWatch: all
    run:
      config: Debug
    archive:
      config: Release
