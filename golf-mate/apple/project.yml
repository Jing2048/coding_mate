name: GolfMate
options:
  bundleIdPrefix: com.golfmate.lab
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "15.4"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0

targets:
  GolfMate:
    type: application
    platform: iOS
    sources:
      - GolfMate
      - Shared
    info:
      path: Config/GolfMate-Info.plist
      properties:
        CFBundleDisplayName: Golf-ai-Jing
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: Config/GolfMate.entitlements
    dependencies:
      - target: GolfMateWatch

  GolfMateWatch:
    type: application
    platform: watchOS
    sources:
      - GolfMateWatch
      - Shared
    info:
      path: Config/GolfMateWatch-Info.plist
      properties:
        CFBundleDisplayName: Golf-ai-Jing
        NSMotionUsageDescription: Golf-ai-Jing uses full-rate wrist motion to analyze your golf swing.
        NSHealthShareUsageDescription: Golf-ai-Jing starts a golf workout to enable high-rate motion capture.
        NSHealthUpdateUsageDescription: Golf-ai-Jing records the active golf workout used for swing capture.
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.golfmate.lab.GolfMate
    entitlements:
      path: Config/GolfMateWatch.entitlements
    settings:
      base:
        WATCHOS_DEPLOYMENT_TARGET: "10.0"

schemes:
  GolfMate:
    build:
      targets:
        GolfMate: all
        GolfMateWatch: all
    run:
      config: Debug
    archive:
      config: Release
